[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nose-olfaction"
version = "1.0.0"
description = "Inference-only API for Neural Olfactory-Semantic Embeddings"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "huggingface-hub>=0.33,<1",
  "numpy>=1.26,<3",
  "peft>=0.16,<1",
  "safetensors>=0.5,<1",
  "torch>=2.5,<3",
  "transformers>=4.51,<5",
]

[project.optional-dependencies]
demo = [
  "ipykernel>=6,<7",
  "matplotlib>=3.8,<4",
  "pandas>=2.2,<3",
  "plotly>=5.20,<7",
  "rdkit>=2024.3",
  "scikit-learn>=1.5,<2",
  "unimol-tools>=0.1.3",
]
test = ["pytest>=8.2,<9"]

[tool.setuptools.packages.find]
where = ["."]
include = ["nose*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
